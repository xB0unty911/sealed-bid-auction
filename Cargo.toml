[package]
name = "sealed_bid"
version = "0.1.0"
authors = ["xB0unty911"]
edition = "2024"

[package.metadata.tari-template]


[dependencies]
# 0.40 emits the V2 template definition (`tari_tdef` section) required by the
# tari-ootle v0.50+ protocol (mainnet genesis stack, tari-ootle v0.53).
tari_template_lib = { version = "0.40" }

[dev-dependencies]
blake2 = "0.10"
tari_bor = "0.17"
tari_utilities = "0.10"
tari_template_test_tooling = "0.53.1"




[lib]
crate-type = ["cdylib"]

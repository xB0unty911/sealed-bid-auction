[package]
name = "sealed-bid-demo"
version = "0.1.0"
edition = "2021"
authors = ["xB0unty911"]
description = "Headless demo client for the sealed-bid auction template on Tari Ootle"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
borsh = "1"
bounded-vec = "0.9"
ootle_byte_type = "0.16"
tari_engine_types = "0.45"
tari_common_types = "6.1"
tari_sidechain = "6.1"
tari_transaction_components = "6.1"
ootle-rs = "0.26"
rand = "0.10"
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tari_crypto = "0.24"
tari_utilities = "0.10"
tari_ootle_transaction = "0.45.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
